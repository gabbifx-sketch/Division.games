<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Division - Browser Games</title>

    <link rel="stylesheet" href="./assets/style/style.css">
    <link rel="icon" href="assets/img/ChatGPT Image Sep 7, 2026, 01_48_33 AM.png">

</head>

<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header>

        <div class="logo-img"></div>

        <div class="title">
            Games
        </div>

        <a
            href="#search-overlay"
            class="search-button"
            title="Search"
        >

            <div class="input-container">

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="30"
                    height="30"
                    viewBox="0 0 24 24"
                    fill="none"
                >

                    <path
                        d="M16.6725 16.6412L21 21M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z"
                        stroke="#ffffff"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                </svg>

            </div>

        </a>

    </header>


    <!-- =========================================
         GAMES
    ========================================== -->

    <main>

        <div class="display-games"></div>

    </main>

<!-- =========================================
     SEARCH OVERLAY
========================================= -->

<div class="search-overlay" id="search-overlay">

    <div class="search-box">

        <!-- Top -->
        <div class="search-top">
            <span>DIVISION SEARCH</span>

            <button class="search-close" id="search-close">
                ESC
            </button>
        </div>


        <!-- Search -->
        <div class="search-input-wrapper">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
            >
                <circle cx="11" cy="11" r="7"></circle>
                <path d="M20 20L16.65 16.65"></path>
            </svg>

            <input
                type="text"
                id="game-search"
                placeholder="Search games..."
                autocomplete="off"
            >

        </div>


        <!-- Results -->
        <div
            id="search-results"
            class="search-results">
        </div>


        <!-- Bottom -->
        <div class="search-bottom">
            <span class="search-brand">DIVISION</span>

            <span class="search-hint">
                Find your next game
            </span>
        </div>

    </div>

</div>
    <!-- =========================================
         GAME LAUNCH OVERLAY
    ========================================== -->

    <div
        class="game-launch-overlay"
        id="gameLaunchOverlay"
    >

        <div class="launch-content">

            <div class="launch-icon">
                 <span id="game-icon-image"></span>
            </div>

            <h2 id="launchGameName">
                Launching Game...
            </h2>

            <p id="launchStatus">
                Getting everything ready...
            </p>

            <div class="launch-button">

                <span class="launch-spinner"></span>

                <span>
                    Loading
                </span>

            </div>

        </div>

    </div>



<section class="categories-section">

    <div class="categories-header">
        <h2>Categories</h2>
    </div>

    <div class="categories-grid">

        <button class="category-card" data-category="Action">
            <img src="assets/img/batman.png" alt="Action">
            <span>Action</span>
        </button>

        <button class="category-card" data-category="Shooting">
            <img src="assets/img/action.png" alt="Shooting">
            <span>Shooting</span>
        </button>

        <button class="category-card" data-category="Racing">
            <img src="assets/img/pngwing.com (22).png" alt="Racing">
            <span>Racing</span>
        </button>

        <button class="category-card" data-category="Driving">
            <img src="assets/img/drivin.png" alt="Driving">
            <span>Driving</span>
        </button>

        <button class="category-card" data-category="Fighting">
            <img src="assets/img/boxing.png" alt="Fighting">
            <span>Fighting</span>
        </button>

        <button class="category-card" data-category="Multiplayer">
            <img src="assets/img/multiplayer.png" alt="Multiplayer">
            <span>Multiplayer</span>
        </button>

        <button class="category-card" data-category="Simulation">
            <img src="assets/img/simulator.png" alt="Simulation">
            <span>Simulation</span>
        </button>

        <button class="category-card" data-category="Adventure">
            <img src="assets/img/adventur.png" alt="Adventure">
            <span>Adventure</span>
        </button>

    </div>

</section>

    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="./assets/script/script.js"></script>

</body>

</html>
